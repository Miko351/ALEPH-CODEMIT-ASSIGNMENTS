name: m5d1-monitor
services:
  monitor-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${MONITOR_DB_PASSWORD:?Generate local DB password in root .env}
    volumes:
      - monitor-data:/var/lib/postgresql/data
      - ./monitor/backend/sql/docker-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [monitor-data]
    restart: unless-stopped
  monitor-api:
    build: ./monitor/backend
    environment:
      DB_HOST: monitor-db
      DB_PORT: "5432"
      DB_NAME: monitor
      DB_USER: monitor
      DB_PASSWORD: ${MONITOR_DB_PASSWORD:?Generate local DB password in root .env}
      DB_SSLMODE: disable
      SECRET_KEY: ${MONITOR_SECRET_KEY:?Generate a separate monitor session key in root .env}
      SESSION_COOKIE_SECURE: "false"
      EVENT_TOKEN: ${EVENT_TOKEN:?Generate the shared EVENT_TOKEN in root .env}
      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: mini-monitor
      APP_VERSION: day2-v1
      HOST: 0.0.0.0
      PORT: "5000"
      GENERAL_URL: http://general-api:5000
    volumes:
      - ./monitor/backend/app.py:/app/monitor/backend/app.py:ro
      - ./monitor/backend/event_rules.py:/app/monitor/backend/event_rules.py:ro
      - ./monitor/backend/routes:/app/monitor/backend/routes:ro
      - ./monitor/backend/repositories:/app/monitor/backend/repositories:ro
      - ./monitor/backend/learning:/app/monitor/backend/learning:ro
    depends_on:
      monitor-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [monitor-web, monitor-data, events]
    restart: unless-stopped
  monitor-web:
    build: ./monitor/next-frontend
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      MONITOR_API_URL: http://monitor-api:5000
      PORT: "3000"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [monitor-web]
    restart: unless-stopped
  monitor-gateway:
    image: nginx:1.28-alpine
    ports: ["8082:80"]
    volumes:
      - ./gateways/monitor.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      monitor-api:
        condition: service_healthy
      monitor-web:
        condition: service_healthy
    networks: [monitor-web]
    restart: unless-stopped
volumes:
  monitor-data:
networks:
  monitor-web:
    driver: bridge
  monitor-data:
    internal: true
  events:
    external: true
    name: m5d1-events
