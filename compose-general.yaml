name: m5d1-general
services:
  general-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: general
      POSTGRES_USER: general
      POSTGRES_PASSWORD: ${GENERAL_DB_PASSWORD:?Generate local DB password in root .env}
    volumes:
      - general-data:/var/lib/postgresql/data
      - ./general/sql/docker-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U general -d general"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [general-data]
    restart: unless-stopped
  general-api:
    build: ./general
    environment:
      DB_HOST: general-db
      DB_PORT: "5432"
      DB_NAME: general
      DB_USER: general
      DB_PASSWORD: ${GENERAL_DB_PASSWORD:?Generate local DB password in root .env}
      DB_SSLMODE: disable
      SECRET_KEY: ${GENERAL_SECRET_KEY:?Generate a separate general session key in root .env}
      SESSION_COOKIE_SECURE: "false"
      EVENT_TOKEN: ${EVENT_TOKEN:?Generate the shared EVENT_TOKEN in root .env}
      ENABLE_SENTRY_TEST: "false"
      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: mini-general
      APP_VERSION: day2-v1
      MONITOR_URL: http://monitor-api:5000/api/events
      HOST: 0.0.0.0
      PORT: "5000"
    depends_on:
      general-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [general-web, general-data, events]
    restart: unless-stopped
  general-gateway:
    image: nginx:1.28-alpine
    ports: ["8081:80"]
    volumes:
      - ./gateways/general.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      general-api:
        condition: service_healthy
    networks: [general-web]
    restart: unless-stopped
volumes:
  general-data:
networks:
  general-web:
    driver: bridge
  general-data:
    internal: true
  events:
    external: true
    name: m5d1-events
